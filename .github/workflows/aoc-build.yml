name: AOC Forge 1.12.2 Build

permissions:
  contents: write

on:
  push:
    paths:
      - 'AOCFinal/**'
      - '.github/workflows/aoc-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: AOCFinal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build
        run: ./gradlew clean build --no-daemon
      - name: Publish JAR to repository
        run: |
          mkdir -p ../releases
          cp build/libs/AndroidOptimizationCore-1.2.1.jar ../releases/AndroidOptimizationCore-1.2.1.jar
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/AndroidOptimizationCore-1.2.1.jar
          git diff --cached --quiet || git commit -m "Publish AndroidOptimizationCore 1.2.1 JAR"
          git push

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidOptimizationCore-build
          path: AOCFinal/build/libs/*.jar
