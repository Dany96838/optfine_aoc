name: AOC Forge 1.12.2 Build

permissions:
  contents: write

concurrency:
  group: aoc-build-main
  cancel-in-progress: true

on:
  push:
    paths:
      - 'AOCFinal/**'
      - '.github/workflows/aoc-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: AOCFinal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build
        run: ./gradlew clean build --no-daemon

      - name: Verify JAR
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          test -n "$JAR"
          test -s "$JAR"
          echo "FINAL_JAR=$JAR"
          ls -lh "$JAR"
          stat -c 'FINAL_JAR_BYTES=%s' "$JAR"
          unzip -t "$JAR" >/dev/null
          unzip -p "$JAR" mcmod.info >/dev/null

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidOptimizationCore-1.4.0
          path: AOCFinal/build/libs/*.jar

      - name: Publish JAR to repository
        run: |
          mkdir -p ../releases
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)"
          cp "$JAR" ../releases/AndroidOptimizationCore-1.4.0.jar
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add releases/AndroidOptimizationCore-1.4.0.jar
          git diff --cached --quiet || git commit -m "Publish AndroidOptimizationCore 1.4.0 JAR"
          git push origin HEAD:main
