name: AOC Build Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AOCFinal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: aoc-build
          path: AOCFinal/build/libs/*.jar
